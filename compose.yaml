# Docker's own copy of every container's stdout, capped (#277). Loki ingesting a container's logs does
# not stop this file growing, so this is the disk floor whatever happens to the pipeline.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: 'postgres:17'
    logging: *default-logging
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB not set — copy .env.example to .env}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set — copy .env.example to .env}'
      - 'POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER not set — copy .env.example to .env}'
      - 'GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD not set — copy .env.example to .env}'
      - 'BFF_DB_PASSWORD=${BFF_DB_PASSWORD:?BFF_DB_PASSWORD not set — copy .env.example to .env}'
    ports:
      # Loopback-only binds (#242): nothing on the LAN should reach these dev services.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the data dir is empty (first boot). Existing volumes: see the
      # script header for the one-time command that creates the role in place.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
  scraper:
    build:
      context: ./scraper
    logging: *default-logging
    ports:
      - '127.0.0.1:8001:8001'
    volumes:
      - ./scraper:/app
    # --reload-include '*.js' so edits to browser_scripts/*.js restart the worker (uvicorn watches
    # only *.py by default); the restart clears load_script's in-process @lru_cache so the new JS
    # is picked up. The bind mount above means dev runs the host files, not the baked image.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-include", "*.js"]
  grafana:
    image: 'grafana/grafana:11.4.0'
    logging: *default-logging
    environment:
      # Seeds the admin only on first boot of grafana_data — an existing volume keeps its
      # old login (possibly the pre-#242 admin/admin) and ignores later changes here. Reset in place:
      #   docker compose exec grafana grafana cli admin reset-admin-password <new-password>
      - 'GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER not set — copy .env.example to .env}'
      - 'GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD not set — copy .env.example to .env}'
      # Forwarded so the datasource provisioning YAML can interpolate them. Grafana connects
      # as the SELECT-only grafana_reader role, never as the application user (#242).
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD}'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres
  # Log store (#277); retention lives in infra/loki/config.yaml.
  loki:
    image: 'grafana/loki:3.7.8'
    logging: *default-logging
    command: ['-config.file=/etc/loki/config.yaml']
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./infra/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
  # Collector (#277); pipeline in infra/alloy/config.alloy, debug UI on 127.0.0.1:12345.
  alloy:
    image: 'grafana/alloy:v1.19.2'
    logging: *default-logging
    command: ['run', '--server.http.listen-addr=0.0.0.0:12345', '--storage.path=/var/lib/alloy/data', '/etc/alloy/config.alloy']
    ports:
      - '127.0.0.1:12345:12345'
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/pricehunt:ro
      # ':ro' protects the socket file, not the Docker API: this is effectively root on the host.
      # Accepted for dev only (loopback binds, our own config, pinned image); an allow-listed socket
      # proxy replaces it at #263.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Tail positions, so a restart does not ship every file again.
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

volumes:
  postgres_data:
  grafana_data:
  loki_data:
  alloy_data:
