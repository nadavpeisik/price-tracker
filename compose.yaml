services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB not set — copy .env.example to .env}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set — copy .env.example to .env}'
      - 'POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER not set — copy .env.example to .env}'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  scraper:
    build:
      context: ./scraper
    ports:
      - '8001:8001'
    volumes:
      - ./scraper:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

volumes:
  postgres_data:
