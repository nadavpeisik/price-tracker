services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB not set — copy .env.example to .env}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set — copy .env.example to .env}'
      - 'POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER not set — copy .env.example to .env}'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  scraper:
    build:
      context: ./scraper
    ports:
      - '8001:8001'
    volumes:
      - ./scraper:/app
    # --reload-include '*.js' so edits to browser_scripts/*.js restart the worker (uvicorn watches
    # only *.py by default); the restart clears load_script's in-process @lru_cache so the new JS
    # is picked up. The bind mount above means dev runs the host files, not the baked image.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-include", "*.js"]
  grafana:
    image: 'grafana/grafana:11.4.0'
    environment:
      # admin/admin default — local-only; gate before any cloud deploy.
      - 'GF_SECURITY_ADMIN_USER=admin'
      - 'GF_SECURITY_ADMIN_PASSWORD=admin'
      # Forwarded so the datasource provisioning YAML can interpolate them.
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
    ports:
      - '3000:3000'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres

volumes:
  postgres_data:
  grafana_data:
