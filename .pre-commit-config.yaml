# Auto-fixes Python lint/format on commit so CI's `ruff check` / `ruff format --check`
# (.github/workflows/ci.yml) pass on the first push instead of round-tripping through CI.
# One-time setup per clone: `pre-commit install`. When a hook auto-fixes files the commit
# aborts — re-stage (`git add`) the fixed files and commit again.
# Pinned to the same ruff version as the scraper's [dev] extra / CI to avoid local↔CI drift.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # SQL: Flyway migrations only (issue #228), whichever are staged. Pinned to CI's version.
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-fix
        files: ^backend/src/main/resources/db/migration/.*\.sql$
      - id: sqlfluff-lint
        files: ^backend/src/main/resources/db/migration/.*\.sql$
