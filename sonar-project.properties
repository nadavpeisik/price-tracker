sonar.projectKey=nadavpeisik_price-tracker
sonar.organization=nadavpeisik

sonar.sources=backend/src/main/java,scraper
sonar.tests=backend/src/test/java,scraper/tests

sonar.java.binaries=backend/target/classes
sonar.java.source=21

sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=scraper/coverage.xml
sonar.python.version=3.12

# browser_scripts/*.js are browser-evaluated assets (intentional bare `() => {...}` expressions,
# moved verbatim in #135) run via Playwright's page.evaluate() and tested through the Python+pytest
# harness — not standalone JS modules. Sonar's JS analyzer would flag the bare expression as a bug
# and report 0% coverage (it can't see the Playwright-driven coverage), so exclude them from analysis.
sonar.exclusions=**/generated/**,**/target/**,**/.venv/**,**/node_modules/**,scraper/tests/**,scraper/browser_scripts/**/*.js
