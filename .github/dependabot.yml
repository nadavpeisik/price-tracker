version: 2

updates:
  # Our actions are pinned to commit SHAs (issue #199) because a git tag is a movable pointer: the
  # owner can repoint `v6` at new code and our next run executes it, with SONAR_TOKEN and
  # GITHUB_TOKEN in scope. Pinning removes that — and freezes us in exchange, so without this file
  # we would never see action updates again, security fixes included. Dependabot understands SHA
  # pins: it bumps the SHA and rewrites the trailing `# v6` comment to match.
  - package-ecosystem: github-actions
    directory: /  # github-actions is always rooted here; it covers all of .github/workflows
    schedule:
      interval: weekly
    groups:
      # Batch ONLY the safe update types. Majors are deliberately left ungrouped, which makes
      # Dependabot open one PR per major — so a breaking one blocks nothing but itself. Grouping
      # everything together means a single bad bump holds the whole batch hostage, including the
      # routine minor/patch bumps queued alongside it. #201 showed it immediately: the very first
      # Dependabot run bundled four majors (checkout/setup-node/setup-python v6→v7, cache v5→v6)
      # into one PR, where any single failure would have stalled the other three. Majors need
      # reading anyway and arrive rarely, so the extra PRs cost little.
      # Note this governs VERSION updates only — `groups` defaults to applies-to: version-updates.
      # Advisory-driven security updates are a separate flow and always get their own PRs, so no
      # grouping here can ever delay one.
      actions-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(ci)

  # Deliberately not covered yet, so their absence reads as a decision rather than an oversight:
  # maven (backend), npm (frontend), and pip/uv (scraper — hash-locked via uv.lock, see #187, and
  # Dependabot's uv support would need checking before trusting it to regenerate our exports).
