name: E2E Canary

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Matches both checkouts in ci.yml. This job never does an authenticated git operation, so
          # leaving the token in .git/config only widens what a later step could read — and this one
          # drives Playwright against live third-party sites.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements-dev.lock
      # Hashed lock, same as CI (issue #187) — a canary that exercises a different dependency tree
      # than the one CI tests and the image ships would report on something nobody runs.
      # The bare filename is correct: defaults.run.working-directory above is `scraper`, so this
      # resolves to scraper/requirements-dev.lock. Review has twice "fixed" this to a repo-root
      # path — don't. Quoted because `:all: ` is a colon-space, which YAML reads as a mapping.
      - run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.lock'
      - run: playwright install --with-deps chromium
      - name: Start scraper
        id: start
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8001 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8001/docs > /dev/null && break
            sleep 0.5
          done
          # Fail loudly if the scraper never became ready — otherwise the loop falls
          # through and the canaries below would spew confusing connection errors that
          # mask the real "scraper didn't boot" cause.
          curl -fsS http://127.0.0.1:8001/docs > /dev/null || {
            echo "::error::scraper did not become ready on 127.0.0.1:8001 within ~15s"
            exit 1
          }
      # Each canary runs independently of the OTHER canaries (always()) so one site's
      # bot-wall block no longer fail-fast-masks a real regression elsewhere — but they
      # are skipped if the scraper never started (steps.start.outcome). canary_assert.py
      # tolerates a Cloudflare "blocked" as an expected environmental outcome (GitHub
      # ::warning::, not a failure — runner datacenter IPs get walled by default) and
      # only fails on a genuine extraction regression (wrong tier / missing / zero
      # price on a reachable page). See issue #80. tee /dev/stderr keeps the raw
      # response in the log while piping it into the asserter.
      - name: Canary — string6 (WooCommerce sale)
        if: always() && steps.start.outcome == 'success'
        run: |
          curl -fsS -X POST http://127.0.0.1:8001/scrape \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://www.string6.co.il/product/duesenberg-starplayer-tv-blue-sparkle"}' \
            | tee /dev/stderr | python canary_assert.py --name string6 --expect-source structured
      - name: Canary — Thomann (microdata)
        if: always() && steps.start.outcome == 'success'
        run: |
          curl -fsS -X POST http://127.0.0.1:8001/scrape \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://www.thomannmusic.com/rme_babyface_pro_fs.htm"}' \
            | tee /dev/stderr | python canary_assert.py --name thomann --expect-source structured
      - name: Canary — Wild Guitars (Cloudflare-protected)
        if: always() && steps.start.outcome == 'success'
        run: |
          curl -fsS -X POST http://127.0.0.1:8001/scrape \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://www.wildguitars.co.il/product/soldano-slo-30-classic/"}' \
            | tee /dev/stderr | python canary_assert.py --name wildguitars --expect-source structured
