name: E2E Canary

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: playwright install --with-deps chromium
      - name: Start scraper
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8001 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8001/docs > /dev/null && break
            sleep 0.5
          done
      - name: Canary — string6 (WooCommerce sale)
        run: |
          resp=$(curl -fsS -X POST http://127.0.0.1:8001/scrape \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://www.string6.co.il/product/duesenberg-starplayer-tv-blue-sparkle"}')
          echo "$resp"
          echo "$resp" | python -c "import json,sys; d=json.load(sys.stdin); assert d['extractionSource']=='structured', d; assert d['priceData']['price']>0, d"
      - name: Canary — Thomann (microdata)
        run: |
          resp=$(curl -fsS -X POST http://127.0.0.1:8001/scrape \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://www.thomannmusic.com/rme_babyface_pro_fs.htm"}')
          echo "$resp"
          echo "$resp" | python -c "import json,sys; d=json.load(sys.stdin); assert d['extractionSource']=='structured', d; assert d['priceData']['price']>0, d"
