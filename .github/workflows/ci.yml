name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Sonar needs full git history for "new code" detection
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - name: Install scraper deps
        working-directory: scraper
        run: pip install -e '.[dev]'

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('scraper/pyproject.toml') }}

      - name: Install Playwright OS deps
        working-directory: scraper
        run: playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: scraper
        run: playwright install chromium

      - name: Ruff lint
        working-directory: scraper
        run: ruff check .

      - name: Ruff format check
        working-directory: scraper
        run: ruff format --check .

      - name: Build, lint, and test backend
        working-directory: backend
        env:
          SPRING_DOCKER_COMPOSE_ENABLED: 'false'
        run: ./mvnw -B verify

      - name: Run scraper tests with coverage
        run: pytest -v scraper/tests --cov=scraper --cov-branch --cov-report=xml:scraper/coverage.xml --cov-report=term

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
