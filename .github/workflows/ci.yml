name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend  # the npm shell lives in the subfolder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # Keep in sync with frontend/.nvmrc and engines.node — Vite 8 /
          # ESLint 10 require Node >= 20.19.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (production)
        run: npm run build

      # ── Prod mock-gate (#144) ─────────────────────────────────────────
      # 1) Bundle sentinel: the mock-only token must be absent from the
      #    compiled production assets (belt-and-suspenders against a
      #    side-effecting mock import surviving the import.meta.env.DEV gate).
      #    Reuses the dist/ from the step above — no rebuild. Scans every
      #    asset except source maps, so a future .mjs/.cjs emit can't slip a
      #    leak past a .js-only filter.
      - name: Mock gate — sentinel absent from production bundle
        run: |
          # Handle grep's three exit codes explicitly: 0 = sentinel found
          # (leak → fail), 1 = not found (clean), anything else = grep itself
          # errored (e.g. dist/ missing/unreadable) and must fail too — a bare
          # `if grep` would misread that error as "clean" and green a broken
          # security gate.
          set +e
          matches=$(grep -rl --exclude='*.map' '__MOCK_DATA_SENTINEL__' dist/)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Mock data sentinel found in the production bundle — mocks leaked:"
            echo "$matches"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::grep failed (exit $status) — dist/ missing or unreadable; cannot verify the mock gate."
            exit 1
          fi
          echo "Sentinel absent from production bundle."

      # 2) A production build with mock mode enabled must FAIL, and fail
      #    *specifically* via the vite.config.ts gate — not from some
      #    unrelated build error that would green this check without ever
      #    exercising the gate. Runs last (it deliberately fails the build).
      - name: Mock gate — VITE_USE_MOCK=true build must fail via the gate
        run: |
          if VITE_USE_MOCK=true npm run build > mock-build.log 2>&1; then
            echo "::error::VITE_USE_MOCK=true production build SUCCEEDED — the mock gate is broken."
            cat mock-build.log
            exit 1
          fi
          if ! grep -q 'VITE_USE_MOCK=true is not allowed for production builds' mock-build.log; then
            echo "::error::Mock-mode build failed, but NOT via the mock gate — an unrelated build error is masking it."
            cat mock-build.log
            exit 1
          fi
          echo "Mock-mode production build failed via the gate, as intended."

  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Sonar needs full git history for "new code" detection
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements-dev.lock

      # Nothing reads pyproject.toml at install time any more, so a dependency edit with stale locks
      # would NOT fail — it would silently build and test the old dependency tree. This is the step
      # that makes the lock a guarantee instead of a convention (issue #187): uv lock --check proves
      # uv.lock matches pyproject.toml, and re-exporting proves the two requirements files match
      # uv.lock. uv is pinned to the version that generated them so a formatting change in a newer
      # uv can't fail the diff spuriously.
      - name: Verify scraper lockfiles are current
        working-directory: scraper
        run: |
          pip install uv==0.12.5
          # git diff ignores untracked files, so a DELETED export would be silently recreated by the
          # re-export below and pass. Assert both are tracked first.
          git ls-files --error-unmatch uv.lock requirements.lock requirements-dev.lock
          uv lock --check
          uv export --no-dev    --no-emit-project -o requirements.lock
          uv export --extra dev --no-emit-project -o requirements-dev.lock
          git diff --exit-code -- requirements.lock requirements-dev.lock

      # From the hashed lock, not pyproject.toml — a lock only counts where installs actually use
      # it (issue #187), otherwise CI tests one dependency tree while the image ships another. The
      # project itself is not installed: pytest's pythonpath = ["."] puts scraper/ on sys.path, so
      # the tests import main/models/sites directly, exactly as uvicorn does in the image.
      - name: Install scraper deps
        working-directory: scraper
        # Quoted: the `:all: ` in --only-binary contains a colon-space, which YAML would otherwise
        # read as a nested mapping and fail to parse the whole workflow.
        run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.lock'

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # Keyed on the lock: the browser build to download follows the locked playwright version.
          # runner.arch is in the key because Chromium builds are per-architecture — without it, an
          # ARM runner could restore an x64 cache and skip the install.
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('scraper/requirements-dev.lock') }}
          path: ~/.cache/ms-playwright

      - name: Install Playwright OS deps
        working-directory: scraper
        run: playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: scraper
        run: playwright install chromium

      - name: Ruff lint
        working-directory: scraper
        run: ruff check .

      - name: Ruff format check
        working-directory: scraper
        run: ruff format --check .

      - name: Build, lint, and test backend
        working-directory: backend
        env:
          SPRING_DOCKER_COMPOSE_ENABLED: 'false'
        run: ./mvnw -B verify

      - name: Run scraper tests with coverage
        run: pytest -v scraper/tests --cov=. --cov-branch --cov-report=xml:scraper/coverage.xml --cov-report=term

      # The scanner pulls a scanner-engine JAR from scanner.sonarcloud.io on every run.
      # That CDN intermittently returns 403, with no env var to skip or pre-cache the
      # fetch. We retry once after a short backoff before failing the job.
      - name: SonarCloud scan
        id: sonar-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Use the runner's already-installed Temurin 21 instead of letting
          # the scanner fetch its own JRE from scanner.sonarcloud.io, which
          # intermittently returns 403 and fails the job.
          SONAR_SCANNER_JAVA_EXE_PATH: ${{ env.JAVA_HOME }}/bin/java

      - name: Backoff before SonarCloud retry
        if: steps.sonar-scan.outcome == 'failure'
        run: |
          echo "First SonarCloud attempt failed; sleeping 30s before retry."
          sleep 30

      - name: SonarCloud scan (retry)
        if: steps.sonar-scan.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_JAVA_EXE_PATH: ${{ env.JAVA_HOME }}/bin/java

      # The scan steps above only UPLOAD; SonarCloud computes the verdict afterwards, so the job
      # went green whatever the gate said. The main-branch gate was therefore red from 2026-06-29
      # to 2026-08-19 with nobody notified — its verdict lands as an app check on a commit page,
      # which sends no notification, while every PR gate stayed legitimately green (different
      # "new code" scope). This step waits for that verdict on main pushes and fails the run, and
      # a failed run is the one thing GitHub does notify about (issue #165).
      # Only on push (= main; PRs already show their own gate next to the merge button). A separate
      # step rather than -Dsonar.qualitygate.wait=true on the scanner: with the continue-on-error
      # retry above, a red gate would look like a transport failure and re-run the whole analysis.
      - name: SonarCloud branch quality gate (main only)
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 12
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
