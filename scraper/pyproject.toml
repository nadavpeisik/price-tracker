[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-tracker-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "playwright==1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "pre-commit==4.0.1",
]

[tool.hatch.build.targets.wheel]
# "sites" / "browser_scripts" are whole package dirs (recursive), so new handlers/scripts need no
# change here. only-include is path-based (not extension-filtered), so browser_scripts/*.js ship too.
only-include = ["main.py", "models.py", "sites", "browser_scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "A"]
# E/F: pycodestyle + pyflakes (correctness)
# I: isort (import order)
# B: bugbear (likely bugs)
# UP: pyupgrade (modernize syntax)
# T20: flake8-print (catch stray print() — should be logger in a FastAPI service)
# A: flake8-builtins (don't shadow list/id/type/etc.)
