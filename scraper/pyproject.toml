[build-system]
# Version-pinned so an explicit local build uses a known backend instead of whatever is current.
# That stabilizes the backend version only — it is neither reproducible nor hash-secured: PEP 518
# has no hash syntax, so pip downloads hatchling, and hatchling's own build deps (packaging,
# pathspec, pluggy, tomlkit, trove-classifiers, …) still float, unverified, in the build env. It
# rarely fires: neither the image nor CI builds this project, both install the hashed locks (#187).
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "price-tracker-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "playwright==1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "pre-commit==4.0.1",
]

[tool.uv]
# Must match the uv pinned in ci.yml's lockfile-freshness step. Export formatting and lock schema can
# shift between uv releases, so a developer on a newer uv would regenerate files that CI then rejects
# as "stale" — a confusing failure with nothing actually wrong. uv refuses to run on a mismatch.
required-version = "==0.12.5"

# A partial safety net for the wheel-only install: uv enforces these environments only for packages
# that publish NO sdist, and for those a missing arm64/amd64 wheel fails `uv lock`. A package that
# ships an sdist but no wheel for one arch still locks fine and only breaks at image-build time — so
# this narrows the blast radius, it does not prove wheel availability. The actual per-arch proof is
# incidental but real: CI installs requirements-dev.lock (a superset of the runtime lock) on amd64
# every run, and `docker build` exercises arm64 locally.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.hatch.build.targets.wheel]
# "sites" / "browser_scripts" are whole package dirs (recursive), so new handlers/scripts need no
# change here. only-include is path-based (not extension-filtered), so browser_scripts/*.js ship too.
only-include = ["main.py", "models.py", "sites", "browser_scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "A"]
# E/F: pycodestyle + pyflakes (correctness)
# I: isort (import order)
# B: bugbear (likely bugs)
# UP: pyupgrade (modernize syntax)
# T20: flake8-print (catch stray print() — should be logger in a FastAPI service)
# A: flake8-builtins (don't shadow list/id/type/etc.)
