[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-tracker-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "playwright==1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "pre-commit==4.0.1",
]

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "A"]
# E/F: pycodestyle + pyflakes (correctness)
# I: isort (import order)
# B: bugbear (likely bugs)
# UP: pyupgrade (modernize syntax)
# T20: flake8-print (catch stray print() — should be logger in a FastAPI service)
# A: flake8-builtins (don't shadow list/id/type/etc.)

[tool.ruff.lint.per-file-ignores]
# main.py embeds JavaScript inside Python triple-quoted strings (sent to the
# browser via page.evaluate). Wrapping long JS lines would either break JS
# syntax or require ugly Python-side concatenation. `# noqa` markers can't
# go inline (they'd become part of the JS payload). Pragmatic exemption.
"main.py" = ["E501"]
