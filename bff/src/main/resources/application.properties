spring.application.name=bff
server.port=8082
# Caddy (#263) terminates TLS; without this {baseUrl} in the redirect-uri resolves to http://bff:8082.
server.forward-headers-strategy=framework

# --- Auth0 (confidential client, Authorization Code + PKCE) ---
# No spring.security.oauth2.client.registration.* / provider.* keys: the ClientRegistration is a bean
# (config/Auth0ClientRegistrationConfig) that derives every endpoint from the issuer, so no OIDC
# discovery runs at boot and every Auth0 call goes through our timed clients. Same stance as the
# backend's explicit jwk-set-uri (#245).
pricehunt.bff.auth0.issuer-uri=${AUTH0_ISSUER_URI}
pricehunt.bff.auth0.client-id=${AUTH0_CLIENT_ID}
pricehunt.bff.auth0.client-secret=${AUTH0_CLIENT_SECRET}
pricehunt.bff.auth0.audience=${AUTH0_AUDIENCE:pricehunt-api}
# Token endpoint (code + refresh grants) and the ID-token JWKS fetch.
pricehunt.bff.auth0.connect-timeout=5s
pricehunt.bff.auth0.read-timeout=10s

# --- Backend proxy ---
pricehunt.bff.backend.base-url=http://localhost:8080
pricehunt.bff.backend.connect-timeout=5s
# One read budget for every route. It must outlast the backend's own outbound budget on POST /track,
# or the BFF answers 502 while the backend goes on to commit the record: scraper read 40s + Groq 4
# attempts x 30s read + 4+8+16s backoff = 188s (backend application.properties), plus connection
# overhead. Not a latency target; a low-traffic tracker does not starve a thread pool over it.
pricehunt.bff.backend.read-timeout=240s

# --- Session policy ---
# Inactivity bound for PRE-LOGIN sessions only (LoginSessionPolicy sets the per-session value on
# login): long enough to finish an Auth0 round trip, short enough that abandoned attempts vanish.
server.servlet.session.timeout=30m
pricehunt.bff.session.absolute-ttl=24h
pricehunt.bff.session.inactivity-ttl=24h
pricehunt.bff.session.remember-me.absolute-ttl=90d
pricehunt.bff.session.remember-me.inactivity-ttl=30d
# How long a request whose session is mid-refresh waits for the in-flight refresh before answering 503.
# Must exceed the winner's worst case (auth0 connect 5s + read 10s + the immediate JDBC write).
pricehunt.bff.session.refresh-wait-timeout=20s

# --- Cookie: __Host- => Secure + Path=/ + no Domain. Lax, not Strict (decided 2026-09-04). ---
server.servlet.session.cookie.name=__Host-pricehunt-session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# --- Session store: own role + schema, Flyway-managed, Spring Session's DDL never auto-runs ---
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=bff_session
spring.datasource.password=${BFF_DB_PASSWORD}
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=bff_sessions.spring_session
# IMMEDIATE: each setAttribute is written to Postgres as it happens instead of at end of request.
# The refresh path depends on it -- a rotated refresh token must be durable before waiters are
# released -- and it also covers the login callback, where changeSessionId() is in-memory until
# the next save. Cost: a handful of extra UPDATEs per login/refresh, none on an ordinary API call.
spring.session.jdbc.flush-mode=immediate
spring.flyway.default-schema=bff_sessions
spring.flyway.schemas=bff_sessions
# The init script owns the schema; a missing one must fail loudly rather than be created as public.
spring.flyway.create-schemas=false
# Default 60s expired-session cleanup kept (issue comment); monitor before tuning.

# health only: the __Host- cookie is host-wide, not port-wide, so anything else here would be one more
# cookie-authenticated surface on a port Caddy never fronts.
management.endpoints.web.exposure.include=health
management.server.port=8083
management.server.address=127.0.0.1
logging.pattern.level=%5p [%X{correlationId:-}]
# Never raise org.springframework.security.oauth2 to DEBUG here: token responses would land in logs.
