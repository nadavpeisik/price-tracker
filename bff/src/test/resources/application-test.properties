# Shadows every no-default env placeholder in application.properties so a context test boots with no
# environment variables -- CI needs no secrets. The .invalid issuer is unroutable (RFC 2606) and is
# never dialed: the integration suites override the ClientRegistration with one pointing at the
# loopback FakeAuth0, and the Testcontainers suites override the datasource on top of these.
pricehunt.bff.auth0.issuer-uri=https://test-issuer.invalid/
pricehunt.bff.auth0.client-id=test-client-id
pricehunt.bff.auth0.client-secret=test-client-secret
pricehunt.bff.auth0.read-timeout=5s
spring.datasource.url=jdbc:postgresql://localhost:5432/bff_test_unused
spring.datasource.password=unused
# Milliseconds, so the stalled-backend 502 case and the waiter-timeout 503 case run fast.
pricehunt.bff.backend.read-timeout=1500ms
pricehunt.bff.session.refresh-wait-timeout=500ms
