# Single-binary Loki for the dev stack (#277). Everything below /loki is on the loki_data volume.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-09-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h
  allow_structured_metadata: true

# retention_period deletes nothing on its own: the compactor is what applies it.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
