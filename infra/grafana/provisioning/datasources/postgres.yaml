apiVersion: 1
datasources:
  - name: PriceHuntPostgres
    uid: pricehunt-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    # SELECT-only role (#242) — never the application user; Grafana doesn't validate query safety.
    user: grafana_reader
    secureJsonData:
      # keep '$' out of this password — Grafana interpolates provisioning values
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
    isDefault: true
    editable: false
