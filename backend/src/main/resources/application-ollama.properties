# ---------------------------------------------------------------------------------------------
# Local-model fallback profile (issue #121): runs price extraction against a natively-installed
# Ollama instead of Groq Cloud. Activate with --spring.profiles.active=ollama (or
# SPRING_PROFILES_ACTIVE=ollama). Needs `ollama serve` running; needs NO GROQ_API_KEY.
#
# Why no key is needed: spring.ai.model.chat=ollama below (plus the spring.ai.model.*=none keys in
# application.properties) disables every OpenAI autoconfig, so OpenAiConnectionProperties is never
# bound and the ${GROQ_API_KEY} placeholder in application.properties is never resolved.
#
# Every LLM key set in application.properties for Groq is re-set here for Ollama — including the
# per-tier models, which would otherwise inherit Groq's model ids and be sent to the local daemon.
# ---------------------------------------------------------------------------------------------
spring.ai.model.chat=ollama

spring.ai.ollama.chat.options.model=qwen3.5:9b
spring.ai.ollama.chat.options.temperature=0
spring.ai.ollama.chat.options.format=json
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.init.embedding.include=false
spring.ai.ollama.init.pull-model-strategy=when_missing
# additional-models is honored only because pull-model-strategy=when_missing is set above;
# without it Spring AI would not pull the snippet-tier model on first boot.
spring.ai.ollama.init.chat.additional-models=qwen3:1.7b

# Disable Spring AI's auto-retry (default 10). The value maps to RetryPolicy.maxRetries(), so 0 =
# one attempt, no retries. A timeout/5xx here means Ollama is RAM-throttled; retrying just piles on
# load. One bounded attempt (capped by pricehunt.ollama.read-timeout), then fail-fast. (The Groq
# default profile sets a real retry budget instead — a hosted 429/5xx IS worth retrying.)
spring.ai.retry.max-attempts=0

# Explicit timeouts for the Ollama RestClient (the blocking, non-streaming .call() path used
# for SNIPPET/FULLTEXT extraction). 120s read tolerates slow local LLM inference; streaming and
# model-pull init use the WebClient (reactor-netty) path and are intentionally unaffected. See
# OllamaClientConfig / OllamaClientProperties.
pricehunt.ollama.connect-timeout=5s
pricehunt.ollama.read-timeout=120s

price.extraction.snippet-model=qwen3:1.7b
price.extraction.fulltext-model=qwen3.5:9b

logging.level.com.np.pricehunt.backend.service.LlmPriceExtractionService=DEBUG
