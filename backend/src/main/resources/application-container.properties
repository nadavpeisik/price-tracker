# Container profile (issue #275). #263 owns the rest of this profile and adds it here.
# Docker captures stdout, so the console is the collected stream and carries ECS. An EMPTY
# logging.file.name is what switches the file appender off: Boot's LogFile.get returns null, so none
# is built and the inherited logging.structured.format.file has nothing to apply to.
logging.structured.format.console=ecs
logging.file.name=
