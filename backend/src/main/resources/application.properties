spring.application.name=backend

scraper.base-url=http://localhost:8001
# Read timeout must clear the scraper worst case: goto (30s) + content-render wait (8s) + margin.
scraper.connect-timeout=5s
scraper.read-timeout=40s
spring.docker.compose.file=../compose.yaml

spring.jpa.hibernate.ddl-auto=validate
# Off: the persistence context must not outlive a transaction (#221) — and controllers return DTOs, so nothing needs it.
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Batch JDBC inserts. batch_size=30 matches the ~30 currencies per ECB daily refresh.
# Requires entity IDs that don't force getGeneratedKeys() per row (see V4 sequence migration).
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Postgres-side: rewrite N parameterized INSERTs into one multi-row INSERT ... VALUES (...), (...), ...
# Without this, Postgres still parses/plans N statements server-side even if Hibernate batches the JDBC calls.
# Forwarded via Hikari because Spring Boot's docker-compose integration owns the JDBC URL.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
# Existing dev/prod DBs already have the schema from before Flyway existed.
# baseline-on-migrate=true: if the DB has tables but no flyway_schema_history,
# record V1 as already applied (without running it) and continue from V2 onward.
# Fresh DBs (no tables) still run V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------------------------------------------------------------------------------------------
# LLM price extraction — Groq Cloud (issue #121). The "ollama" profile
# (application-ollama.properties) swaps every key below for the local-model equivalents.
# ---------------------------------------------------------------------------------------------
# Both the OpenAI and Ollama starters are on the classpath and BOTH autoconfigs default to ON
# (matchIfMissing=true), which would create two ChatModel beans and break ChatClient.Builder
# autoconfig. This property picks exactly one. The `=none` keys below do the same for the sibling
# model types the OpenAI starter also registers (embedding/image/moderation/audio) — none of which
# we use. They are also what makes the ollama profile boot with no GROQ_API_KEY: with every OpenAI
# autoconfig disabled, OpenAiConnectionProperties is never bound and the ${GROQ_API_KEY}
# placeholder below is never resolved.
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# Groq speaks the OpenAI wire protocol, so the OpenAI starter reaches it via a base-url override.
# completions-path MUST be overridden: it defaults to /v1/chat/completions, which against a base-url
# already ending in /openai/v1 would POST to /openai/v1/v1/chat/completions.
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.completions-path=/chat/completions
# No default: an unset GROQ_API_KEY must fail the boot loudly rather than start and 401 on the first
# extraction. Use the ollama profile for key-free local work.
spring.ai.openai.api-key=${GROQ_API_KEY}
# Model here is the bean-level default; every call overrides it per tier (see price.extraction.*).
# gpt-oss is the only Groq production family supporting strict schema-enforced structured output.
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0
# Extraction is classification-like, not a reasoning task — minimize thinking tokens for latency.
spring.ai.openai.chat.options.reasoning-effort=low

# Retry posture. max-attempts maps to RetryPolicy.maxRetries(), so 3 = four calls worst case
# (4s + 8s + 16s of backoff). Classification order in Spring AI's error handler:
# code in on-http-codes -> transient/retried; else 4xx -> fail-fast; else 5xx -> transient/retried.
# So listing 429 ADDS the rate-limit case without disabling 5xx retries, while a 400 (strict-schema
# violation) still fails fast. Sized from the first observed Groq 429s (2026-08-29): the free tier's
# tokens-per-minute window asked for "try again in 1.8-2.8s", so a 2s first retry fired too early
# and burned itself; 4s clears it, and the full ladder outlasts a ~8s token-window refill. No jitter
# or Retry-After knob exists in this property surface; client-side pacing is tracked in #171.
spring.ai.retry.max-attempts=3
spring.ai.retry.on-http-codes=429
spring.ai.retry.backoff.initial-interval=4s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=20s

# Explicit timeouts for the Groq RestClient (blocking .call() path used for extraction). 30s read is
# generous for a hosted LPU (~500-1000 tok/s, ~50-token outputs) and keeps the worst-case synchronous
# POST /track bounded. See GroqLlmConfig / GroqClientProperties.
pricehunt.groq.connect-timeout=5s
pricehunt.groq.read-timeout=30s

price.extraction.snippet-model=openai/gpt-oss-20b
price.extraction.fulltext-model=openai/gpt-oss-120b

# Lets the scraper's lowercase availability/extractionSource tokens ("available") bind to the
# uppercase Java enum names (Jackson 3 MapperFeature). The unknown-token → UNKNOWN default is handled
# per-mapper on the LLM path (LlmPriceExtractionService): Jackson 3 moved that feature off
# DeserializationFeature to EnumFeature, and the scraper only ever sends canonical tokens.
spring.jackson.mapper.accept-case-insensitive-enums=true
price.tracking.max-delta-percent=200
price.tracking.min-refresh-interval=1m

# Failure-first scrape-attempt audit (issue #131). Retention TTL + the daily UTC purge cron; a high
# safety ceiling on persisted/extracted LLM input (only trips on pathological page bloat); and the
# disabled-by-default gate on the dev-only regression export endpoint.
scrape.audit.retention=90d
scrape.audit.purge-cron=0 15 3 * * *
scrape.audit.max-llm-input-chars=8000
scrape.audit.export-enabled=false
# Indexed binding required: a regex like {2,3} contains a comma, which the unindexed form would split on.
price.validation.unsupported-host-patterns[0]=(^|\\.)amazon\\.[a-z]{2,3}(\\.[a-z]{2})?$

price.scheduler.enabled=true
price.scheduler.fixed-delay=12h
price.scheduler.initial-delay=1m

pricehunt.currency.default-display=ILS
pricehunt.currency.fx-margin-percent=0
# Daily 16:30 UTC — after ECB's ~16:00 CET publication window
pricehunt.currency.fx.refresh-cron=0 30 16 * * *
pricehunt.currency.fx.connect-timeout=5s
pricehunt.currency.fx.read-timeout=30s

management.endpoints.web.exposure.include=health,info,metrics,loggers,threaddump
management.server.port=8081
management.server.address=127.0.0.1

logging.pattern.level=%5p [%X{correlationId:-}]

logging.level.com.np.pricehunt.backend.service.LlmPriceExtractionService=DEBUG
