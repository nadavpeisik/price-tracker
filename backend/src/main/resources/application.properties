spring.application.name=backend

scraper.base-url=http://localhost:8001
spring.docker.compose.file=../compose.yaml

spring.jpa.hibernate.ddl-auto=update

spring.ai.ollama.chat.options.model=qwen3.5:9b
spring.ai.ollama.chat.options.temperature=0
spring.ai.ollama.chat.options.format=json
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.init.embedding.include=false
spring.ai.ollama.init.pull-model-strategy=when_missing
# additional-models is honored only because pull-model-strategy=when_missing is set above;
# without it Spring AI would not pull the snippet-tier model on first boot.
spring.ai.ollama.init.chat.additional-models=qwen3:1.7b

price.extraction.snippet-model=qwen3:1.7b
price.extraction.fulltext-model=qwen3.5:9b

spring.jackson.mapper.accept-case-insensitive-enums=true
price.validation.max-delta-percent=200
# Indexed binding required: a regex like {2,3} contains a comma, which the unindexed form would split on.
price.validation.unsupported-host-patterns[0]=(^|\\.)amazon\\.[a-z]{2,3}(\\.[a-z]{2})?$
price.refresh.min-interval-seconds=60

price.scheduler.enabled=true
price.scheduler.fixed-delay-ms=21600000
price.scheduler.initial-delay-ms=60000

management.endpoints.web.exposure.include=health,info,metrics,loggers,threaddump
management.server.port=8081
management.server.address=127.0.0.1

logging.pattern.level=%5p [%X{correlationId:-}]

logging.level.com.np.pricehunt.backend.service.OllamaPriceExtractionService=DEBUG
