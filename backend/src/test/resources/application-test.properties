# @DataJpaTest uses in-memory H2. Our migrations are Postgres-flavored,
# so let Hibernate generate H2 schema from entities and keep Flyway off here.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Shadows the ${GROQ_API_KEY} placeholder in application.properties so a full-context test boots with
# no environment variable -- CI needs no Groq secret. No test exercises the LLM path (extraction is
# always mocked), and a stray real call would fail loudly with a 401 rather than reach the provider.
spring.ai.openai.api-key=test-key

# Shadows ${AUTH0_ISSUER_URI} (#245) the same way: Boot's decoder conditions read the property at
# startup and throw on an unresolved placeholder. The .invalid host is unroutable by RFC 2606 and the
# decoder fetches keys lazily, so nothing is ever dialed; the security tests point jwk-set-uri at a
# loopback fixture and mint tokens with this issuer.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://test-issuer.invalid/
